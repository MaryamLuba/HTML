<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey</title>
</head>
<body>
    <header>
        <h1>Survey Table!</h1>
    </header>
    <table border="bold">
        <thead>
            <tr>
                <th>Question</th>
                <th>Yes</th>
                <th>No</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Do you like Libas?</td>
                <td><input type="radio" name="like" value="yes"></td>
                <td><input type="radio" name="like" value="no"></td>
            </tr>
            <tr>
                <td>Do you support fair trade?</td>
                <td><input type="radio" name="fair_trade" value="yes"></td>
                <td><input type="radio" name="fair_trade" value="no"></td>
            </tr>
            <tr>
                <td>Would you travel with us?</td>
                <td><input type="radio" name="travel" value="yes"></td>
                <td><input type="radio" name="travel" value="no"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
