<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactForm</title>
</head>
<body>
   <header><h1>Contact Form</h1></header>
   <form>
   <label>
    Name 
    <input type="text" placeholder="Name">
     </label>
      <label>
    Email
    <input type="email" placeholder="Email">
     </label>
    <br>
     <label>
    Phone No.
    <input type="number" placeholder="Phone No.">
     </label>
      <label>
    Country
    <input type="text" >
    <br>
     </label>
     <label >Gender :</label>
     <br>
     <label for="ma">Male</label>
     <input type="radio" id="ma" name="Gender" value="male">
     <br>
     <label for="fe">Female</label>
     <input type="radio" id="fe" name="Gender" value="female">
     <br>

     Languages Known : 
     <br>
     <label><input type="checkbox"  value="English">English</label>
     <br>
     <label><input type="checkbox"  value="Urdu">Urdu</label>
     <br>
     <label><input type="checkbox" value="Arabic">Arabic</label>
     <br>
     <label><input type="checkbox" value="Aramaic">Aramaic</label>
      <br>
     Favourite Material:
     <select >

          <option value="Cotton">Cotton</option>
          <option value="Silk">Silk</option>
          <option value="Wool">Wool</option>
          <option value="Linen">Linen</option>
          <option value="Polyester">Polyester</option>
   </select>
   <br>
   Budget
   <input type="range">
   <br>
   Message:
   <br>
   <textarea></textarea>
   <br>
   <button type="submit">Send</button>
</form>
   
</body>
</html>
